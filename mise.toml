[tools]
node = "lts"
go = "latest"

[tasks]
setup = { run = "go install github.com/wailsapp/wails/v2/cmd/wails@latest", description = "Install Wails CLI" }
dev = { run = "wails dev", description = "Run Wails in development mode" }
build = { run = "wails build", description = "Build the Wails application" }
tts-export-v4 = { run = "uv run --directory tools/irodori_export --python 3.11 --no-sync python export.py", description = "Export isolated Irodori v4.1 ONNX graphs" }
tts-parity-v4 = { run = "uv run --directory tools/irodori_export --python 3.11 --no-sync python parity.py", description = "Check Irodori v4.1 PyTorch/ORT parity" }
tts-parity = { run = "go run ./cmd/tts-parity --model model/irodori-v4.1 --ep cpu --seed 0 --fixture model/irodori-v4.1/go-parity-fixture.json", description = "Run numeric Go/ORT v4 graph, condition, CFG, and 40-step parity (override with cmd/tts-parity flags)" }
tts-smoke = { run = "go run ./cmd/tts-smoke --service --model model/irodori-v4.1 --ep cpu --seed 0 --text 'こんにちは。これは複数文のスモークです。' --steps 2 --seconds 0.5", description = "Run explicit v4 service preflight and multi-sentence WAV smoke; override model/ep/seed and use --expect-error for abnormal bundles" }
tts-benchmark = { run = "go run ./cmd/tts-benchmark --model-v3 model/irodori-v3 --model-v4 model/irodori-v4.1 --ep cpu --seed 0 --ref narrator/narrator_01.wav --steps 40 --scripts 10 --steady-repeats 20", description = "Measure product Service/Talk fixed 10-script v3/v4.1 latency, p95 ratio, deadline, polled process VRAM and lifecycle evidence; run CPU/CUDA/auto separately" }
tts-audition = { run = "go run ./cmd/tts-benchmark --audition-only --out evidence/tts-audition-formal --model-v3 model/irodori-v3 --model-v4 model/irodori-v4.1 --ep cuda --ref narrator/narrator_01.wav --steps 40 --scripts 10 --steady-repeats 20", description = "Generate the formal product-Service 10-script x seed0/1/2 x v3/v4.1 (60 ignored WAV + manifest) human-audition set" }
tts-e2e = { run = "go run ./cmd/tts-e2e --model model/irodori-v4.1 --ep cpu --cycles 3 --steps 40 --seconds -1 --bgm-model model/sa3-sm-music --bgm-steps 1 --bgm-seconds 1", description = "Run real Player + Stable Audio BGM + v4.1 Talk through local RSS/LLM fixture, audio server, restart child and shutdown E2E" }
